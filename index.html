
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#030704">
  <title>Vérification de l'âge</title>
  <link rel="icon" href="/freecash-logo.webp" type="image/webp">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(
        circle at 50% 20%,
        #143322,
        #07150c 45%,
        #030704
      );
      color: #f5fff7;
    }

    .age-gate {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 22px;
    }

    .age-box {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .age-icon {
      width: 94px;
      height: 94px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      background: linear-gradient(#67ffa3, #20d66b);
      color: #031108;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 16px 36px rgba(57,255,136,.28);
    }

    h1 {
      font-size: clamp(32px, 9vw, 46px);
      line-height: 1.08;
      margin-bottom: 14px;
    }

    p {
      color: #a7b8ab;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .age-actions {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      min-height: 66px;
      padding: 14px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }

    .yes {
      border: none;
      color: #031108;
      background: linear-gradient(#67ffa3, #20d66b);
    }

    .no {
      color: #e8f3eb;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.10);
    }

    .deny {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 14px;
      color: #ffc0c7;
      background: rgba(255,92,108,.08);
      border: 1px solid rgba(255,92,108,.20);
      font-size: 13px;
      font-weight: 800;
    }
  </style>
</head>

<body>
  <main class="age-gate">
    <section class="age-box">
      <div class="age-icon">21+</div>

      <h1>Vous avez 21 ans ou plus ?</h1>

      <p>
        Cette page est réservée aux personnes
        âgées de 21 ans ou plus.
      </p>

      <div class="age-actions">
        <button class="yes" id="yesBtn" type="button">
          Oui, j'ai 21 ans ou plus
        </button>

        <button class="no" id="noBtn" type="button">
          Non, j'ai moins de 21 ans
        </button>
      </div>

      <div class="deny" id="denyMsg" role="alert">
        Désolé, vous ne pouvez pas accéder
        à cette page.
      </div>
    </section>
  </main>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const denyMsg = document.getElementById("denyMsg");

    yesBtn.addEventListener("click", function () {
      const destination = new URL(
        "/home/",
        window.location.origin
      );

      destination.search = window.location.search;
      window.location.assign(destination.href);
    });

    noBtn.addEventListener("click", function () {
      denyMsg.style.display = "block";
    });
  </script>
</body>
</html>
