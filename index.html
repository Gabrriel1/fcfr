
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030704">
  <title>Vérification de l'âge</title>
  <link rel="icon" href="data:,">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #030704;
      --card: #0b1710;
      --card2: #101f16;
      --green: #39ff88;
      --green2: #19c762;
      --text: #f5fff7;
      --muted: #a7b8ab;
      --yellow: #ffd56a;
      --red: #ff5c6c;
      --line: rgba(255,255,255,.10);
      --shadow: 0 24px 70px rgba(0,0,0,.55);
      --font: -apple-system, BlinkMacSystemFont,
        "Segoe UI", system-ui, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(57,255,136,.35),
          transparent 35%
        ),
        radial-gradient(
          circle at 100% 25%,
          rgba(255,213,106,.16),
          transparent 28%
        ),
        linear-gradient(
          180deg,
          #06140b 0%,
          #030704 65%,
          #020302 100%
        );
      overflow-x: hidden;
    }

    body.lock {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .age-gate {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 99999;
      display: block;
      padding: 0;
      background: #030704;
      overflow-y: auto;
      overscroll-behavior: contain;
      transition:
        opacity .25s ease,
        visibility .25s ease;
    }

    .age-gate.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .age-box {
      width: 100%;
      max-width: none;
      min-height: 100vh;
      min-height: 100dvh;
      padding:
        max(30px, env(safe-area-inset-top))
        22px
        max(30px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 0;
      background:
        radial-gradient(
          circle at 50% 20%,
          #143322 0%,
          #07150c 45%,
          #030704 100%
        );
      border: 0;
      box-shadow: none;
    }

    .age-box h2,
    .age-box p,
    .age-actions,
    .deny {
      width: 100%;
      max-width: 520px;
    }

    .age-icon {
      width: 94px;
      height: 94px;
      border-radius: 24px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      color: #031108;
      font-size: 28px;
      font-weight: 1000;
      background:
        linear-gradient(
          180deg,
          #67ffa3,
          #20d66b
        );
      box-shadow:
        0 16px 36px rgba(57,255,136,.28);
    }

    .age-box h2 {
      font-size: 46px;
      line-height: 1.03;
      letter-spacing: -.06em;
      margin-bottom: 10px;
    }

    .age-box p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .age-actions {
      display: grid;
      gap: 12px;
    }

    .age-actions button {
      border: 0;
      min-height: 66px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      font-family: inherit;
      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .age-actions button:active {
      transform: scale(.97);
    }

    .yes {
      color: #031108;
      background:
        linear-gradient(
          180deg,
          #67ffa3,
          #20d66b
        );
      box-shadow:
        0 16px 30px rgba(32,214,107,.24);
    }

    .yes:hover {
      box-shadow:
        0 18px 40px rgba(32,214,107,.35);
    }

    .no {
      color: #e8f3eb;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.10) !important;
    }

    .deny {
      display: none;
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,92,108,.08);
      border: 1px solid rgba(255,92,108,.20);
      color: #ffc0c7;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .age-box {
        padding: 30px 22px 26px;
      }

      .age-box h2 {
        font-size: clamp(32px, 9vw, 44px);
      }
    }

    @media (max-width: 370px) {
      .age-icon {
        width: 82px;
        height: 82px;
        font-size: 25px;
      }

      .age-box h2 {
        font-size: 32px;
      }

      .age-box p {
        font-size: 14px;
      }

      .age-actions button {
        min-height: 60px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body class="lock">

  <!-- VÉRIFICATION DE L'ÂGE -->

  <div class="age-gate" id="ageGate">

    <div class="age-box">

      <div class="age-icon">
        21+
      </div>

      <h2>
        Vous avez 21 ans ou plus ?
      </h2>

      <p>
        Cette page est réservée aux personnes
        âgées de 21 ans ou plus.
      </p>

      <div class="age-actions">

        <button
          class="yes"
          id="yesBtn"
          type="button"
        >
          Oui, j'ai 21 ans ou plus
        </button>

        <button
          class="no"
          id="noBtn"
          type="button"
        >
          Non, j'ai moins de 21 ans
        </button>

      </div>

      <div
        class="deny"
        id="denyMsg"
        role="alert"
      >
        Désolé, vous ne pouvez pas accéder
        à cette page.
      </div>

    </div>

  </div>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const denyMsg = document.getElementById("denyMsg");

    // Utilisateur âgé de 21 ans ou plus
    yesBtn.addEventListener("click", function () {
      const destination = new URL(
        "/home/",
        window.location.origin
      );

      // Conserver les paramètres de l'URL
      destination.search = window.location.search;

      window.location.assign(destination.toString());
    });

    // Utilisateur âgé de moins de 21 ans
    noBtn.addEventListener("click", function () {
      denyMsg.style.display = "block";
    });
  </script>

</body>
</html>
