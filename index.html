
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030704">
  <title>Vérification de l'âge</title>
  <link rel="icon" href="/freecash-logo.webp" type="image/webp">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
      color: #f5fff7;
      background: #030704;
    }

    .age-gate {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
      background: radial-gradient(
        circle at 50% 20%,
        #143322 0%,
        #07150c 45%,
        #030704 100%
      );
    }

    .age-box {
      width: 100%;
      max-width: 560px;
      padding: 30px 22px;
      text-align: center;
    }

    .age-icon {
      width: 94px;
      height: 94px;
      margin: 0 auto 22px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      color: #031108;
      font-size: 28px;
      font-weight: 1000;
      background: linear-gradient(180deg, #67ffa3, #20d66b);
      box-shadow: 0 16px 36px rgba(57,255,136,.28);
    }

    h1 {
      font-size: clamp(32px, 9vw, 46px);
      line-height: 1.05;
      letter-spacing: -.06em;
      margin-bottom: 14px;
      font-weight: 1000;
    }

    .description {
      color: #a7b8ab;
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .age-actions {
      display: grid;
      gap: 12px;
    }

    .age-actions button {
      width: 100%;
      min-height: 66px;
      padding: 12px;
      border-radius: 18px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .2s;
    }

    .age-actions button:active {
      transform: scale(.97);
    }

    .yes {
      border: none;
      color: #031108;
      background: linear-gradient(180deg, #67ffa3, #20d66b);
      box-shadow: 0 16px 30px rgba(32,214,107,.24);
    }

    .no {
      color: #e8f3eb;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.10);
    }

    .deny {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 14px;
      color: #ffc0c7;
      background: rgba(255,92,108,.08);
      border: 1px solid rgba(255,92,108,.20);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="age-gate">
    <section class="age-box">

      <div class="age-icon">21+</div>

      <h1>Vous avez 21 ans ou plus ?</h1>

      <p class="description">
        Cette page est réservée aux personnes
        âgées de 21 ans ou plus.
      </p>

      <div class="age-actions">
        <button class="yes" id="yesBtn" type="button">
          Oui, j'ai 21 ans ou plus
        </button>

        <button class="no" id="noBtn" type="button">
          Non, j'ai moins de 21 ans
        </button>
      </div>

      <div class="deny" id="denyMsg" role="alert">
        Désolé, vous ne pouvez pas accéder à cette page.
      </div>

    </section>
  </main>

  <script>
    "use strict";

    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const denyMsg = document.getElementById("denyMsg");

    yesBtn.addEventListener("click", function () {
      const destination = new URL(
        "/home/",
        window.location.origin
      );

      // Păstrează parametrii de tracking.
      destination.search = window.location.search;

      window.location.assign(destination.href);
    });

    noBtn.addEventListener("click", function () {
      denyMsg.style.display = "block";
    });
  </script>
</body>
</html>
